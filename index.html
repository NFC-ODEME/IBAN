<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAST | Hızlı Transfer</title>
    <!-- Google Fonts & FontAwesome Premium İkonları -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        :root {
            --bg-main: #06080f;
            --card-bg: rgba(13, 17, 28, 0.8);
            --card-border: rgba(255, 255, 255, 0.06);
            --text-primary: #ffffff;
            --text-secondary: #64748b;
            --text-muted: #475569;
            --btn-bg: #ffffff;
            --btn-text: #000000;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            background-image: radial-gradient(at 50% 0%, rgba(255, 255, 255, 0.04) 0px, transparent 60%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Lüks Kart Yapısı */
        .premium-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 40px 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        /* FAST Logosunun Dijital Görünümü */
        .logo-box {
            display: inline-flex;
            background: #000000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 10px 24px;
            margin-bottom: 24px;
        }

        .logo-text {
            color: #ffffff;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-style: italic;
        }

        h2 {
            color: var(--text-primary);
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 30px;
        }

        /* Bilgilerin Listelendiği Alan */
        .info-container {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
            text-align: left;
        }

        .info-row {
            margin-bottom: 16px;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .label {
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            display: block;
        }

        .value {
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 600;
        }

        .value.iban {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            word-break: break-all;
            white-space: normal; /* Ekrana tam sığmasını ve eksiksiz görünmesini sağlar */
            line-height: 1.4;
        }

        /* Tek ve Büyük Premium Kopyalama Butonu */
        .main-action-btn {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.05);
        }

        .main-action-btn:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.9);
        }

        /* Başarı Durumunda Buton Değişimi */
        .main-action-btn.success {
            background: var(--success-color);
            color: #ffffff;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
        }

        .security-footer {
            margin-top: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
        }

        /* Telefonlar İçin Akıcı Alt Bildirim (Toast) */
        .toast-panel {
            position: fixed;
            bottom: -70px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            color: #000000;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 9999;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            width: max-content;
        }

        .toast-panel.show {
            bottom: 40px;
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="premium-card">
        <!-- FAST Logosu -->
        <div class="logo-box">
            <div class="logo-text">Fast</div>
        </div>
        
        <h2>Hesap Bilgileri</h2>
        <p class="subtitle">Tek tuşla tüm bilgileri kopyalayıp transfere başlayın.</p>

        <!-- Bilgi Ekranı -->
        <div class="info-container">
            <div class="info-row">
                <span class="label">Alıcı Adı Soyadı</span>
                <div class="value" id="isim">Veysel Çin</div>
            </div>
            <div class="info-row">
                <span class="label">IBAN Numarası</span>
                <div class="value iban" id="iban">TR17 0004 6008 0988 8000 1332 08</div>
            </div>
        </div>

        <!-- Tek Tuşla Kopyalama Butonu -->
        <button class="main-action-btn" id="copyBtn" onclick="tekTuslaKopyala()">
            <i class="fa-regular fa-copy" id="btnIcon"></i>
            <span id="btnText">Tüm Bilgileri Kopyala</span>
        </button>

        <div class="security-footer">
            <i class="fa-solid fa-shield-halved"></i>
            <span>Güvenli Akıllı Banka Entegrasyonu</span>
        </div>
    </div>

    <!-- Alt Bildirim Kutusu -->
    <div id="toast" class="toast-panel">
        <i class="fa-solid fa-circle-check" style="color: var(--success-color);"></i>
        <span>Tüm bilgiler başarıyla kopyalandı!</span>
    </div>

    <script>
        function tekTuslaKopyala() {
            const isimText = document.getElementById('isim').innerText;
            // Bankaların akıllı transferde hata yapmaması için IBAN'ın temiz halini de ekliyoruz
            const ibanTextRaw = document.getElementById('iban').innerText;
            const ibanTextClean = ibanTextRaw.replace(/\s/g, '');

            // Hem isim soyisimi hem de IBAN'ı alt alta birleştirerek kopyalar
            const birlesikMetin = `Alıcı: ${isimText}\nIBAN: ${ibanTextClean}`;

            navigator.clipboard.writeText(birlesikMetin).then(() => {
                const btn = document.getElementById('copyBtn');
                const btnIcon = document.getElementById('btnIcon');
                const btnText = document.getElementById('btnText');
                const toast = document.getElementById('toast');

                // Butonu yeşil ve başarılı durumuna getirir
                btn.classList.add('success');
                btnIcon.className = "fa-solid fa-check";
                btnText.innerText = "Kopyalandı!";
                
                // Toast bildirimi gösterilir
                toast.classList.add('show');

                // 2.5 saniye sonra sistemi eski görünümüne sıfırlar
                setTimeout(() => {
                    btn.classList.remove('success');
                    btnIcon.className = "fa-regular fa-copy";
                    btnText.innerText = "Tüm Bilgileri Kopyala";
                    toast.classList.remove('show');
                }, 2500);
            }).catch(err => {
                console.error('Kopyalama işlemi başarısız:', err);
            });
        }
    </script>
</body>
</html>
