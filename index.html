<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAST Transfer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000000; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        
        .card { background: #0a0a0c; border: 1px solid #1a1a1a; border-radius: 20px; padding: 35px 20px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        
        /* FAST Logosunun fırçalı, sert sokak stili görünümü */
        .fast-logo { font-size: 50px; font-weight: 900; color: #ffffff; text-transform: uppercase; font-style: italic; letter-spacing: -2px; margin-bottom: 5px; line-height: 1; }
        .subtitle { color: #71717a; font-size: 13px; margin-bottom: 25px; }
        
        .box { background: #121214; border-radius: 12px; padding: 15px; text-align: left; margin-bottom: 20px; border: 1px solid #1c1c1f; }
        .label { color: #52525b; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; display: block; }
        .text { color: #ffffff; font-size: 15px; font-weight: 600; }
        .iban { font-family: monospace; font-size: 14px; word-break: break-all; white-space: normal; line-height: 1.4; color: #e4e4e7; }
        
        /* Tek ve Büyük Kopyalama Butonu */
        .copy-btn { background: #ffffff; color: #000000; border: none; width: 100%; padding: 16px; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .copy-btn:active { background: #cccccc; }
        .copy-btn.success { background: #10b981; color: #ffffff; }
        
        /* Bildirim (Toast) */
        .toast { position: fixed; bottom: -60px; left: 50%; transform: translateX(-50%); background: #ffffff; color: #000000; padding: 12px 24px; border-radius: 30px; font-size: 13px; font-weight: 700; box-shadow: 0 10px 20px rgba(0,0,0,0.5); transition: bottom 0.3s; opacity: 0; }
        .toast.show { bottom: 30px; opacity: 1; }
    </style>
</head>
<body>

    <div class="card">
        <div class="fast-logo">FAST</div>
        <p class="subtitle">Bilgileri tek tuşla kopyalayın.</p>

        <div class="box">
            <span class="label">Alıcı</span>
            <div class="text" id="name">Veysel Çin</div>
        </div>

        <div class="box">
            <span class="label">IBAN Numarası</span>
            <div class="text iban" id="iban">TR17 0004 6008 0988 8000 1332 08</div>
        </div>

        <!-- Kolayca Kopyalayan Tek Buton -->
        <button class="copy-btn" id="btn" onclick="kopyala()">Bilgileri Kopyala</button>
    </div>

    <div id="toast" class="toast">Kopyalandı!</div>

    <script>
        function kopyala() {
            var nameText = document.getElementById('name').innerText;
            var ibanText = document.getElementById('iban').innerText.replace(/\s/g, '');
            
            // Hem isim hem boşluksuz IBAN tek satırda birleşiyor
            var textToCopy = nameText + " " + ibanText;

            // Her telefonda çalışan kesin kopyala yöntemi
            var input = document.createElement('textarea');
            input.value = textToCopy;
            document.body.appendChild(input);
            input.select();
            input.setSelectionRange(0, 99999);
            document.execCommand('copy');
            document.body.removeChild(input);

            // Başarı efektleri
            var btn = document.getElementById('btn');
            var toast = document.getElementById('toast');
            
            btn.className = "copy-btn success";
            btn.innerText = "Kopyalandı!";
            toast.className = "toast show";

            setTimeout(function() {
                btn.className = "copy-btn";
                btn.innerText = "Bilgileri Kopyala";
                toast.className = "toast";
            }, 2000);
        }
    </script>
</body>
</html>
